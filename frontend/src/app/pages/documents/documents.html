<div class="page">
  <div class="header">
    <h1>Documents</h1>
    <button mat-raised-button color="primary" (click)="openCreate()" *ngIf="authService.canManage()">
      <mat-icon>add</mat-icon> Nouveau document
    </button>
  </div>

  <table mat-table [dataSource]="items" class="mat-elevation-z2">
    <ng-container matColumnDef="nom">
      <th mat-header-cell *matHeaderCellDef>Nom</th>
      <td mat-cell *matCellDef="let r">{{ r.nom }}</td>
    </ng-container>
    <ng-container matColumnDef="chemin">
      <th mat-header-cell *matHeaderCellDef>Chemin</th>
      <td mat-cell *matCellDef="let r">{{ r.chemin }}</td>
    </ng-container>
    <ng-container matColumnDef="documentable_type">
      <th mat-header-cell *matHeaderCellDef>Type lié</th>
      <td mat-cell *matCellDef="let r">{{ r.documentable_type }}</td>
    </ng-container>
    <ng-container matColumnDef="documentable_id">
      <th mat-header-cell *matHeaderCellDef>ID lié</th>
      <td mat-cell *matCellDef="let r">{{ r.documentable_id }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let r">
        <button mat-icon-button color="primary" (click)="openEdit(r)" *ngIf="authService.canManage()"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button color="warn" (click)="deleteItem(r.id!)" *ngIf="authService.canManage()"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>

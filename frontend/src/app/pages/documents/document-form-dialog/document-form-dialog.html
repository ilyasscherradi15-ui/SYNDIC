<h2 mat-dialog-title>{{ isEdit ? 'Modifier' : 'Nouveau' }} document</h2>
<mat-dialog-content>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Nom</mat-label>
    <input matInput [(ngModel)]="item.nom" required />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Chemin</mat-label>
    <input matInput [(ngModel)]="item.chemin" placeholder="documents/fichier.pdf" required />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width" *ngIf="!isEdit">
    <mat-label>Type lié</mat-label>
    <mat-select [(ngModel)]="item.documentable_type" (selectionChange)="onTypeChange()">
      <mat-option value="depense">Dépense</mat-option>
      <mat-option value="logement">Logement</mat-option>
      <mat-option value="residence">Résidence</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width" *ngIf="!isEdit && item.documentable_type === 'depense'">
    <mat-label>Dépense</mat-label>
    <mat-select [(ngModel)]="item.documentable_id" required>
      <mat-option *ngFor="let d of depenses" [value]="d.id">{{ d.categorie }} — {{ d.montant }} DH ({{ d.date_depense }})</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width" *ngIf="!isEdit && item.documentable_type === 'logement'">
    <mat-label>Logement</mat-label>
    <mat-select [(ngModel)]="item.documentable_id" required>
      <mat-option *ngFor="let l of logements" [value]="l.id">{{ l.numero }} ({{ l.type }})</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width" *ngIf="!isEdit && item.documentable_type === 'residence'">
    <mat-label>Résidence</mat-label>
    <mat-select [(ngModel)]="item.documentable_id" required>
      <mat-option *ngFor="let r of residences" [value]="r.id">{{ r.nom }} — {{ r.ville }}</mat-option>
    </mat-select>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Annuler</button>
  <button mat-raised-button color="primary" (click)="save()">Enregistrer</button>
</mat-dialog-actions>

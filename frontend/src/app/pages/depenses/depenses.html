<div class="page">
  <div class="header">
    <h1>Dépenses</h1>
    <button mat-raised-button color="primary" (click)="openCreate()">
      <mat-icon>add</mat-icon> Nouvelle dépense
    </button>
  </div>

  <table mat-table [dataSource]="items" class="mat-elevation-z2">
    <ng-container matColumnDef="date_depense">
      <th mat-header-cell *matHeaderCellDef>Date</th>
      <td mat-cell *matCellDef="let r">{{ r.date_depense }}</td>
    </ng-container>
    <ng-container matColumnDef="categorie">
      <th mat-header-cell *matHeaderCellDef>Catégorie</th>
      <td mat-cell *matCellDef="let r">{{ r.categorie }}</td>
    </ng-container>
    <ng-container matColumnDef="fournisseur">
      <th mat-header-cell *matHeaderCellDef>Fournisseur</th>
      <td mat-cell *matCellDef="let r">{{ r.fournisseur }}</td>
    </ng-container>
    <ng-container matColumnDef="montant">
      <th mat-header-cell *matHeaderCellDef>Montant</th>
      <td mat-cell *matCellDef="let r">{{ r.montant }} DH</td>
    </ng-container>
    <ng-container matColumnDef="residence_id">
      <th mat-header-cell *matHeaderCellDef>Résidence (ID)</th>
      <td mat-cell *matCellDef="let r">{{ r.residence_id }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let r">
        <button mat-icon-button color="primary" (click)="openEdit(r)"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button color="warn" (click)="deleteItem(r.id!)"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>

<h2 mat-dialog-title>{{ isEdit ? 'Modifier' : 'Nouvelle' }} dépense</h2>
<mat-dialog-content>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Date</mat-label>
    <input matInput type="date" [(ngModel)]="item.date_depense" required />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Catégorie</mat-label>
    <mat-select [(ngModel)]="item.categorie">
      <mat-option *ngFor="let c of categories" [value]="c">{{ c }}</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Fournisseur</mat-label>
    <input matInput [(ngModel)]="item.fournisseur" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Description</mat-label>
    <input matInput [(ngModel)]="item.description" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Montant (DH)</mat-label>
    <input matInput type="number" [(ngModel)]="item.montant" required />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>ID Résidence</mat-label>
    <input matInput type="number" [(ngModel)]="item.residence_id" required />
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Annuler</button>
  <button mat-raised-button color="primary" (click)="save()">Enregistrer</button>
</mat-dialog-actions>

<div class="page">
  <div class="header">
    <h1>Occupants</h1>
    <button mat-raised-button color="primary" (click)="openCreate()" *ngIf="authService.canManage()">
      <mat-icon>add</mat-icon> Nouvel occupant
    </button>
  </div>

  <table mat-table [dataSource]="items" class="mat-elevation-z2">
    <ng-container matColumnDef="nom_complet">
      <th mat-header-cell *matHeaderCellDef>Nom complet</th>
      <td mat-cell *matCellDef="let r">{{ r.nom_complet }}</td>
    </ng-container>
    <ng-container matColumnDef="telephone">
      <th mat-header-cell *matHeaderCellDef>Téléphone</th>
      <td mat-cell *matCellDef="let r">{{ r.telephone }}</td>
    </ng-container>
    <ng-container matColumnDef="date_entree">
      <th mat-header-cell *matHeaderCellDef>Date entrée</th>
      <td mat-cell *matCellDef="let r">{{ r.date_entree }}</td>
    </ng-container>
    <ng-container matColumnDef="date_sortie">
      <th mat-header-cell *matHeaderCellDef>Date sortie</th>
      <td mat-cell *matCellDef="let r">{{ r.date_sortie || '-' }}</td>
    </ng-container>
    <ng-container matColumnDef="logement_id">
      <th mat-header-cell *matHeaderCellDef>Logement (ID)</th>
      <td mat-cell *matCellDef="let r">{{ r.logement_id }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let r">
        <button mat-icon-button color="primary" (click)="openEdit(r)" *ngIf="authService.canManage()"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button color="warn" (click)="deleteItem(r.id!)" *ngIf="authService.canManage()"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>

<h2 mat-dialog-title>{{ isEdit ? 'Modifier' : 'Nouvel' }} occupant</h2>
<mat-dialog-content>
  <div *ngIf="errorMessage" class="error-banner">{{ errorMessage }}</div>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Nom complet</mat-label>
    <input matInput [(ngModel)]="item.nom_complet" required />
  </mat-form-field>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Téléphone</mat-label>
    <input matInput [(ngModel)]="item.telephone" />
  </mat-form-field>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Email</mat-label>
    <input matInput type="email" [(ngModel)]="item.email" />
  </mat-form-field>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Date d'entrée</mat-label>
    <input matInput type="date" [(ngModel)]="item.date_entree" required />
  </mat-form-field>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Date de sortie</mat-label>
    <input matInput type="date" [(ngModel)]="item.date_sortie" />
  </mat-form-field>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Logement</mat-label>
    <mat-select [(ngModel)]="item.logement_id" required>
      <mat-option *ngFor="let l of logements" [value]="l.id">{{ l.numero }} ({{ l.type }})</mat-option>
    </mat-select>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Annuler</button>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="saving">
    {{ saving ? 'Enregistrement...' : 'Enregistrer' }}
  </button>
</mat-dialog-actions>

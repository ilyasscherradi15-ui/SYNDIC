<h2 mat-dialog-title>{{ isEdit ? 'Modifier' : 'Nouveau' }} paiement</h2>
<mat-dialog-content>
  <div *ngIf="errorMessage" class="error-banner">{{ errorMessage }}</div>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Montant (DH)</mat-label>
    <input matInput type="number" [(ngModel)]="item.montant" required />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Moyen de paiement</mat-label>
    <input matInput [(ngModel)]="item.moyen_paiement" placeholder="virement, espèces..." />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Cotisation</mat-label>
    <mat-select [(ngModel)]="item.cotisation_id" required>
      <mat-option *ngFor="let c of cotisations" [value]="c.id">{{ c.type }} — {{ c.montant }} DH</mat-option>
    </mat-select>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Annuler</button>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="saving">
    {{ saving ? 'Enregistrement...' : 'Enregistrer' }}
  </button>
</mat-dialog-actions>

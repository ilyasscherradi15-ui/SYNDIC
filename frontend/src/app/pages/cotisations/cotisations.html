<div class="page">
  <div class="header">
    <h1>Cotisations</h1>
    <button mat-raised-button color="primary" (click)="openCreate()" *ngIf="authService.canManage()">
      <mat-icon>add</mat-icon> Nouvelle cotisation
    </button>
  </div>

  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Rechercher (type, statut)</mat-label>
    <input matInput [(ngModel)]="searchTerm" (ngModelChange)="applyFilter()" />
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <table mat-table [dataSource]="items" class="mat-elevation-z2">
    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef>Type</th>
      <td mat-cell *matCellDef="let r">{{ r.type }}</td>
    </ng-container>
    <ng-container matColumnDef="montant">
      <th mat-header-cell *matHeaderCellDef>Montant</th>
      <td mat-cell *matCellDef="let r">{{ r.montant }} DH</td>
    </ng-container>
    <ng-container matColumnDef="date_echeance">
      <th mat-header-cell *matHeaderCellDef>Échéance</th>
      <td mat-cell *matCellDef="let r">{{ r.date_echeance }}</td>
    </ng-container>
    <ng-container matColumnDef="statut">
      <th mat-header-cell *matHeaderCellDef>Statut</th>
      <td mat-cell *matCellDef="let r">{{ r.statut }}</td>
    </ng-container>
    <ng-container matColumnDef="logement_id">
      <th mat-header-cell *matHeaderCellDef>Logement (ID)</th>
      <td mat-cell *matCellDef="let r">{{ r.logement_id }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let r">
        <button mat-icon-button color="primary" (click)="openEdit(r)" *ngIf="authService.canManage()"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button color="warn" (click)="deleteItem(r.id!)" *ngIf="authService.canManage()"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <p *ngIf="items.length === 0" class="no-results">Aucune cotisation trouvée.</p>
</div>

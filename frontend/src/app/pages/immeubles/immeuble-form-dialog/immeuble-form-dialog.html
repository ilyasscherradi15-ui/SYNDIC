<h2 mat-dialog-title>{{ isEdit ? 'Modifier' : 'Nouvel' }} immeuble</h2>
<mat-dialog-content>
  <div *ngIf="errorMessage" class="error-banner">{{ errorMessage }}</div>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Nom</mat-label>
    <input matInput [(ngModel)]="item.nom" required />
  </mat-form-field>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Nombre d'étages</mat-label>
    <input matInput type="number" [(ngModel)]="item.nb_etages" />
  </mat-form-field>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Description</mat-label>
    <input matInput [(ngModel)]="item.description" />
  </mat-form-field>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Résidence</mat-label>
    <mat-select [(ngModel)]="item.residence_id" required>
      <mat-option *ngFor="let r of residences" [value]="r.id">{{ r.nom }} — {{ r.ville }}</mat-option>
    </mat-select>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Annuler</button>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="saving">
    {{ saving ? 'Enregistrement...' : 'Enregistrer' }}
  </button>
</mat-dialog-actions>

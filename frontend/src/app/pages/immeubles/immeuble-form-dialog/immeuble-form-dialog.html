<h2 mat-dialog-title>{{ isEdit ? 'Modifier' : 'Nouvel' }} immeuble</h2>
<mat-dialog-content>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Nom</mat-label>
    <input matInput [(ngModel)]="item.nom" required />
  </mat-form-field>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Nombre d'étages</mat-label>
    <input matInput type="number" [(ngModel)]="item.nb_etages" />
  </mat-form-field>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Description</mat-label>
    <input matInput [(ngModel)]="item.description" />
  </mat-form-field>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>ID Résidence</mat-label>
    <input matInput type="number" [(ngModel)]="item.residence_id" required />
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Annuler</button>
  <button mat-raised-button color="primary" (click)="save()">Enregistrer</button>
</mat-dialog-actions>

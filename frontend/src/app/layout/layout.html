<mat-sidenav-container class="app-container">
  <mat-sidenav #sidenav [mode]="sidenavMode" [opened]="sidenavOpened" class="sidenav">
    <div class="sidenav-header">
      <h2>Syndic</h2>
    </div>
    <mat-nav-list>
      <a mat-list-item *ngFor="let item of menuItems" [routerLink]="item.path" routerLinkActive="active-link" (click)="closeSidenavOnMobile(sidenav)">
        <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
        <span matListItemTitle>{{ item.label }}</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button mat-icon-button (click)="toggleSidenav(sidenav)" *ngIf="isMobile">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-title">Gestion de Syndic</span>
      <span class="spacer"></span>
      <button mat-icon-button (click)="logout()" title="Déconnexion">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>
    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
